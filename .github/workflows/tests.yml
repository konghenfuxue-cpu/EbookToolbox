name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Validate release versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/validate_release.py --tag "$env:RELEASE_TAG"

      - name: Check formatting and lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  package:
    name: Windows portable build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Build and smoke-test portable app
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipChecks

      - name: Upload portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EbookToolbox-windows-portable-${{ github.sha }}
          path: |
            dist/EbookToolbox-portable.zip
            dist/EbookToolbox-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Download verified build and publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: EbookToolbox-windows-portable-${{ github.sha }}
        run: |
          gh run download "$env:BUILD_RUN_ID" --name "$env:ARTIFACT_NAME" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          python scripts/validate_release.py --tag "$env:RELEASE_TAG" --artifact-directory dist
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
          gh release create "$env:RELEASE_TAG" dist/EbookToolbox-portable.zip dist/EbookToolbox-portable.zip.sha256 --verify-tag --title "EbookToolbox $env:RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
